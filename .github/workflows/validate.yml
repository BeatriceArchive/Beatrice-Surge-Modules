name: Validate Surge modules

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pinned public Surge Config contract
        uses: actions/checkout@v4
        with:
          repository: BeatriceArchive/Beatrice-Surge-Config
          ref: 63b848b91d527b3c75e45f1701968a5dbe4babe9
          path: Beatrice-Surge-Config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate module metadata and script references
        run: node scripts/validate-modules.mjs

      - name: Validate public Config and Modules contract
        run: node scripts/validate-config-contract.mjs Beatrice-Surge-Config/Beatrice-Surge.conf Modules/Beatrice-Surge-System.sgmodule

      - name: Run isolated behavior tests
        run: node --test tests/*.test.mjs

      - name: Check script syntax
        run: for script in Scripts/*.js; do node --check "$script"; done
