name: Validate Surge modules

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate module metadata and script references
        run: node scripts/validate-modules.mjs
      - name: Run isolated behavior tests
        run: node --test tests/*.test.mjs
      - name: Check script syntax
        run: for script in Scripts/*.js; do node --check "$script"; done
